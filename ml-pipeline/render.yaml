services:
  # ── Web Service: FastAPI prediction server ────────────────────────────────
  - type: web
    name: farmersync-ml-api
    runtime: python
    region: frankfurt
    plan: free                 # free tier (750 hrs/month)
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn serving.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: API_SECRET_TOKEN
        sync: false            # set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: farmersync-db
          property: connectionString
      - key: MODEL_VERSION
        value: v1
      - key: MIN_SAMPLES_TO_RETRAIN
        value: "100"
      - key: MIN_ACCURACY_IMPROVEMENT
        value: "0.01"
      - key: ML_API_URL
        sync: false            # set to https://farmersync-ml-api.onrender.com

  # ── Cron Job: daily model retraining at 02:00 UTC ────────────────────────
  - type: cron
    name: farmersync-retrain-job
    runtime: python
    region: frankfurt
    plan: free
    schedule: "0 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m training.train --job-id cron
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmersync-db
          property: connectionString
      - key: API_SECRET_TOKEN
        sync: false
      - key: MIN_SAMPLES_TO_RETRAIN
        value: "100"
      - key: MIN_ACCURACY_IMPROVEMENT
        value: "0.01"
      - key: ML_API_URL
        sync: false

# ── Managed PostgreSQL (free tier: 1 GB, 90-day limit on free plan) ───────
databases:
  - name: farmersync-db
    plan: free
    region: frankfurt
    databaseName: farmersync
    user: farmersync_user
